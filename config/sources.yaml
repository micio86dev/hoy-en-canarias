# Source registry for the Canary Islands events importer.
# Adding a municipality that runs The Events Calendar (WordPress) takes four lines:
#   - id: x, name: Ayto. X, adapter: tribe_events, url: https://<site>/wp-json/tribe/events/v1/events
# `priority` (default 50): when two sources disagree on a field the higher one wins (official
# open data and municipal calendars 80, the sports federation site 70, tourism aggregator 60,
# ticketing 30). `stale: true` marks datasets that no longer publish events.
# `sources` are importable; `candidates` and `excluded` only feed the sources report.
# All endpoints below were checked with live GET requests on 2026-10-15.

sources:
  - id: holaislascanarias
    priority: 60
    name: Hola Islas Canarias (Turismo de Canarias)
    adapter: drupal_jsonapi
    url: https://www.holaislascanarias.com/jsonapi/node/event
    homepage: https://www.holaislascanarias.com/eventos/
    islands: [Tenerife, Gran Canaria, Lanzarote, Fuerteventura, La Palma, La Gomera, El Hierro, La Graciosa]
    license: "unknown – ToS not published (aviso-legal 404 on 2026-10-15)"
    notes: >-
      Main source, all islands. Dates are date-only (no times). Some records have source typos
      (year 0026) or multi-year ranges; the central overlap filter handles them.

  - id: cabildo_tenerife_deportes
    priority: 80
    name: Cabildo de Tenerife - agenda deportiva (open data)
    adapter: ckan
    url: https://datos.tenerife.es/ckan/api/3/action/package_show?id=agenda-de-eventos-deportivos-en-tenerife
    homepage: https://datos.tenerife.es/ckan/dataset/agenda-de-eventos-deportivos-en-tenerife
    islands: [Tenerife]
    categories: [sports]
    license: CC-BY
    notes: >-
      JSON resource, ~3300 events (history included). Same events as deportes_tenerife
      (deduplication test case). Organizer is sometimes a numeric id and is dropped.

  - id: deportes_tenerife
    priority: 70
    name: Deportes Tenerife
    adapter: tribe_events
    url: https://deportestenerife.es/wp-json/tribe/events/v1/events
    homepage: https://deportestenerife.es
    islands: [Tenerife]
    categories: [sports]
    license: null
    notes: >-
      The site declares timezone "UTC+0" but publishes Canary wall-clock times; they are read
      as Atlantic/Canary.

  - id: deportes_tenerife_ical
    priority: 70
    name: Deportes Tenerife (iCal)
    adapter: ical
    url: https://deportestenerife.es/?ical=1
    homepage: https://deportestenerife.es
    enabled: false
    islands: [Tenerife]
    categories: [sports]
    license: null
    params:
      force_timezone: Atlantic/Canary
    notes: Duplicate of deportes_tenerife (REST); kept as a fallback. TZID=UTC is wrong in the feed.

  - id: candelaria
    priority: 80
    name: Ayuntamiento de Candelaria
    adapter: tribe_events
    url: https://www.candelaria.es/wp-json/tribe/events/v1/events
    homepage: https://www.candelaria.es
    islands: [Tenerife]
    municipality: Candelaria
    license: null
    notes: Declares timezone Europe/London (same UTC offset as Atlantic/Canary all year).

  - id: santiago_del_teide
    priority: 80
    name: Ayuntamiento de Santiago del Teide
    adapter: tribe_events
    url: https://www.santiagodelteide.es/wp-json/tribe/events/v1/events
    homepage: https://www.santiagodelteide.es
    islands: [Tenerife]
    municipality: Santiago del Teide
    license: null

  - id: granadilla_de_abona
    priority: 80
    name: Ayuntamiento de Granadilla de Abona
    adapter: tribe_events
    url: https://www.granadilladeabona.org/wp-json/tribe/events/v1/events
    homepage: https://www.granadilladeabona.org
    islands: [Tenerife]
    municipality: Granadilla de Abona
    license: null

  - id: antigua
    priority: 80
    name: Ayuntamiento de Antigua
    adapter: tribe_events
    url: https://ayto-antigua.es/wp-json/tribe/events/v1/events
    homepage: https://ayto-antigua.es
    islands: [Fuerteventura]
    municipality: Antigua
    license: null

  - id: antigua_ical
    priority: 80
    name: Ayuntamiento de Antigua (iCal)
    adapter: ical
    url: https://ayto-antigua.es/events/?ical=1
    homepage: https://ayto-antigua.es
    enabled: false
    islands: [Fuerteventura]
    municipality: Antigua
    license: null
    notes: Duplicate of antigua (REST); kept as a fallback.

  - id: los_silos
    priority: 80
    name: Ayuntamiento de Los Silos
    adapter: tribe_events
    url: https://www.lossilos.es/wp-json/tribe/events/v1/events
    homepage: https://www.lossilos.es
    islands: [Tenerife]
    municipality: Los Silos
    license: null
    notes: Endpoint verified 2026-10-15; the calendar was empty (0 events).

  - id: santa_ursula
    priority: 80
    name: Ayuntamiento de Santa Úrsula
    adapter: tribe_events
    url: https://www.santaursula.es/wp-json/tribe/events/v1/events
    homepage: https://www.santaursula.es
    islands: [Tenerife]
    municipality: Santa Úrsula
    license: null
    notes: Endpoint verified 2026-10-15; the calendar was empty (0 events).

  - id: valle_gran_rey
    priority: 80
    name: Ayuntamiento de Valle Gran Rey
    adapter: tribe_events
    url: https://www.vallegranrey.es/wp-json/tribe/events/v1/events
    homepage: https://www.vallegranrey.es
    islands: [La Gomera]
    municipality: Valle Gran Rey
    license: null
    notes: Endpoint verified 2026-10-15; the calendar was empty (0 events).

  - id: ticketmaster
    priority: 30
    name: Ticketmaster Discovery API
    adapter: ticketmaster
    url: https://app.ticketmaster.com/discovery/v2/events.json
    homepage: https://developer.ticketmaster.com/
    islands: [Tenerife, Gran Canaria, Lanzarote, Fuerteventura, La Palma, La Gomera, El Hierro, La Graciosa]
    categories: [concerts, sports]
    license: Ticketmaster API terms of use (attribution and link back required)
    auth_env: TICKETMASTER_API_KEY
    notes: >-
      Opt-in: skipped with a warning when TICKETMASTER_API_KEY is not set. Free key, 5000 calls
      per day. Coverage in the Canary Islands is unmeasured.

  - id: gobcan_agenda_cultural
    priority: 80
    stale: true
    name: Gobierno de Canarias - agenda cultural (open data)
    adapter: ckan
    url: https://datos.canarias.es/catalogos/general/api/3/action/package_show?id=agenda-cultural
    homepage: https://datos.canarias.es/catalogos/general/dataset/agenda-cultural
    enabled: false
    license: gobcan-aviso-legal
    params:
      profile: gobcan_agenda
      resource_id: d179079c-a2ed-40dc-a748-7b64d093c342
    notes: >-
      Stale: the "agendaproxima.csv" resource only holds 5 events ending 2022-03-17 and the
      package metadata was last modified 2025-03-06. Adapter is ready if the dataset revives.

  - id: santacruz_agenda_cultural
    priority: 80
    stale: true
    name: Ayuntamiento de Santa Cruz de Tenerife - agenda cultural (open data)
    adapter: ckan
    url: https://www.santacruzdetenerife.es/opendata/api/3/action/package_show?id=agenda-cultural
    homepage: https://www.santacruzdetenerife.es/opendata/dataset/agenda-cultural
    enabled: false
    islands: [Tenerife]
    municipality: Santa Cruz de Tenerife
    license: cc-by
    params:
      resource_format: JSON
      records_key: docs
      field_map:
        title: nombre
        description: descripcion
        start: fecha_inicio
        end: fecha_fin
        category: categoria
        venue: lugar
        image: imagen
    notes: >-
      Stale: package metadata last modified 2019-05-21 and the sample records are from 2019.
      The field map follows the JSON resource and was only inspected, not run end to end.

