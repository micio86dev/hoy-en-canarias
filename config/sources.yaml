# Source registry for the Canary Islands events importer.
# Adding a municipality that runs The Events Calendar (WordPress) takes four lines:
#   - id: x, name: Ayto. X, adapter: tribe_events, url: https://<site>/wp-json/tribe/events/v1/events
# `priority` (default 50): when two sources disagree on a field the higher one wins (official
# open data and municipal calendars 80, the sports federation site 70, tourism aggregator 60,
# ticketing 30). `stale: true` marks datasets that no longer publish events.
# `sources` are importable; `candidates` and `excluded` only feed the sources report.
# `adapter: web` sources read HTML portals with tiered, deterministic extraction (see `params`
# in each entry); the top-level `ai:` section (disabled by default, loopback Ollama only) is the
# optional last tier and each source must also opt in with `params.ai: true`.
# All endpoints below were checked with live GET requests on 2026-10-15.
#
# Optional crawl behaviour (every key has a safe default; see canarias_events/crawl_settings.py):
#   crawl:
#     concurrency: 4            # sources fetched at once; per-host rate limits still apply
#     anomaly_drop_ratio: 0.7   # quarantine a run whose event count fell by more than 70%
#     failure_threshold: 3      # temporary failures in a row before exponential backoff
# A source may set `frequency: daily | weekly | <n>h | <n>d` to be skipped until due
# (`import-events --force` ignores it).

sources:
  - id: holaislascanarias
    priority: 60
    name: Hola Islas Canarias (Turismo de Canarias)
    adapter: drupal_jsonapi
    url: https://www.holaislascanarias.com/jsonapi/node/event
    homepage: https://www.holaislascanarias.com/eventos/
    islands: [Tenerife, Gran Canaria, Lanzarote, Fuerteventura, La Palma, La Gomera, El Hierro, La Graciosa]
    license: "unknown – ToS not published (aviso-legal 404 on 2026-10-15)"
    notes: >-
      Main source, all islands. Dates are date-only (no times). Some records have source typos
      (year 0026) or multi-year ranges; the central overlap filter handles them.

  - id: cabildo_tenerife_deportes
    priority: 80
    name: Cabildo de Tenerife - agenda deportiva (open data)
    adapter: ckan
    url: https://datos.tenerife.es/ckan/api/3/action/package_show?id=agenda-de-eventos-deportivos-en-tenerife
    homepage: https://datos.tenerife.es/ckan/dataset/agenda-de-eventos-deportivos-en-tenerife
    islands: [Tenerife]
    categories: [sports]
    license: CC-BY
    notes: >-
      JSON resource, ~3300 events (history included). Same events as deportes_tenerife
      (deduplication test case). Organizer is sometimes a numeric id and is dropped.

  - id: deportes_tenerife
    priority: 70
    name: Deportes Tenerife
    adapter: tribe_events
    url: https://deportestenerife.es/wp-json/tribe/events/v1/events
    homepage: https://deportestenerife.es
    islands: [Tenerife]
    categories: [sports]
    license: null
    notes: >-
      The site declares timezone "UTC+0" but publishes Canary wall-clock times; they are read
      as Atlantic/Canary.

  - id: deportes_tenerife_ical
    priority: 70
    name: Deportes Tenerife (iCal)
    adapter: ical
    url: https://deportestenerife.es/?ical=1
    homepage: https://deportestenerife.es
    enabled: false
    islands: [Tenerife]
    categories: [sports]
    license: null
    params:
      force_timezone: Atlantic/Canary
    notes: Duplicate of deportes_tenerife (REST); kept as a fallback. TZID=UTC is wrong in the feed.

  - id: candelaria
    priority: 80
    name: Ayuntamiento de Candelaria
    adapter: tribe_events
    url: https://www.candelaria.es/wp-json/tribe/events/v1/events
    homepage: https://www.candelaria.es
    islands: [Tenerife]
    municipality: Candelaria
    license: null
    notes: Declares timezone Europe/London (same UTC offset as Atlantic/Canary all year).

  - id: santiago_del_teide
    priority: 80
    name: Ayuntamiento de Santiago del Teide
    adapter: tribe_events
    url: https://www.santiagodelteide.es/wp-json/tribe/events/v1/events
    homepage: https://www.santiagodelteide.es
    islands: [Tenerife]
    municipality: Santiago del Teide
    license: null

  - id: granadilla_de_abona
    priority: 80
    name: Ayuntamiento de Granadilla de Abona
    adapter: tribe_events
    url: https://www.granadilladeabona.org/wp-json/tribe/events/v1/events
    homepage: https://www.granadilladeabona.org
    islands: [Tenerife]
    municipality: Granadilla de Abona
    license: null

  - id: antigua
    priority: 80
    name: Ayuntamiento de Antigua
    adapter: tribe_events
    url: https://ayto-antigua.es/wp-json/tribe/events/v1/events
    homepage: https://ayto-antigua.es
    islands: [Fuerteventura]
    municipality: Antigua
    license: null

  - id: antigua_ical
    priority: 80
    name: Ayuntamiento de Antigua (iCal)
    adapter: ical
    url: https://ayto-antigua.es/events/?ical=1
    homepage: https://ayto-antigua.es
    enabled: false
    islands: [Fuerteventura]
    municipality: Antigua
    license: null
    notes: Duplicate of antigua (REST); kept as a fallback.

  - id: los_silos
    priority: 80
    name: Ayuntamiento de Los Silos
    adapter: tribe_events
    url: https://www.lossilos.es/wp-json/tribe/events/v1/events
    homepage: https://www.lossilos.es
    islands: [Tenerife]
    municipality: Los Silos
    license: null
    notes: Endpoint verified 2026-10-15; the calendar was empty (0 events).

  - id: santa_ursula
    priority: 80
    name: Ayuntamiento de Santa Úrsula
    adapter: tribe_events
    url: https://www.santaursula.es/wp-json/tribe/events/v1/events
    homepage: https://www.santaursula.es
    islands: [Tenerife]
    municipality: Santa Úrsula
    license: null
    notes: Endpoint verified 2026-10-15; the calendar was empty (0 events).

  - id: valle_gran_rey
    priority: 80
    name: Ayuntamiento de Valle Gran Rey
    adapter: tribe_events
    url: https://www.vallegranrey.es/wp-json/tribe/events/v1/events
    homepage: https://www.vallegranrey.es
    islands: [La Gomera]
    municipality: Valle Gran Rey
    license: null
    notes: Endpoint verified 2026-10-15; the calendar was empty (0 events).

  # ---------------------------------------------------------------- HTML portals (adapter: web)
  # Tiered extraction (JSON-LD, sitemap detail pages, embedded JSON, generic blocks, optional
  # renderer, optional local model). Priority 40: below APIs and open data, so deduplication
  # never overwrites better data with scraped data. robots.txt is always respected.

  - id: webtenerife
    priority: 40
    name: Tenerife Tourism Corporation (webtenerife.com)
    adapter: web
    url: https://www.webtenerife.com/agenda/
    homepage: https://www.webtenerife.com/agenda/
    islands: [Tenerife]
    license: "unknown – ToS not checked; HTML only"
    params:
      sitemap_url: https://www.webtenerife.com/sitemap.xml/
      sitemap_url_pattern: '/agenda/\d{4}/\d{2}/[^/]+/$'
      max_detail_pages: 40
    notes: >-
      Detail pages carry schema.org Event JSON-LD (dates are date-only; price "0" without a
      currency is ignored). Candidate URLs come from the sitemap, window months first.

  - id: auditorio_teatro_lpa
    priority: 40
    name: Auditorio Alfredo Kraus y Teatro Pérez Galdós (Las Palmas de Gran Canaria)
    adapter: web
    url: https://auditorioteatrolaspalmasgc.es/
    homepage: https://auditorioteatrolaspalmasgc.es/
    islands: [Gran Canaria]
    municipality: Las Palmas de Gran Canaria
    license: "unknown – ToS not checked; HTML only"
    notes: >-
      The home page embeds the productions as a Nuxt payload (__NUXT_DATA__, devalue format)
      with dates, times, venue and links. The api subdomain is not documented, so it is not used.

  - id: teatro_leal
    priority: 40
    name: Teatro Leal (San Cristóbal de La Laguna)
    adapter: web
    url: https://www.teatroleal.es/programacion/
    homepage: https://www.teatroleal.es
    islands: [Tenerife]
    municipality: San Cristóbal de La Laguna
    license: "unknown – ToS not checked; HTML only"
    params:
      venue_name: Teatro Leal
      year_policy: strict
    notes: Server-rendered listing, explicit years. No robots.txt (404 means allowed).

  - id: tea_tenerife
    priority: 40
    name: TEA Tenerife Espacio de las Artes
    adapter: web
    url: https://teatenerife.es/actividades
    homepage: https://teatenerife.es
    islands: [Tenerife]
    municipality: Santa Cruz de Tenerife
    license: "unknown – ToS not checked; HTML only"
    params:
      venue_name: TEA Tenerife Espacio de las Artes
    notes: Server-rendered listing with explicit dates and date ranges.

  - id: adeje_agenda
    priority: 40
    name: Ayuntamiento de Adeje - agenda
    adapter: web
    url: https://www.adeje.es/contenido/91
    homepage: https://www.adeje.es
    islands: [Tenerife]
    municipality: Adeje
    license: "unknown – ToS not checked; HTML only"
    params:
      year_policy: infer
    notes: >-
      FLAGGED: the date circle often omits the year ("19-23 oct"), so years are inferred as the
      occurrence closest to the run date (extra.extraction.year_inferred = true).

  - id: arona_agenda
    priority: 40
    name: Ayuntamiento de Arona - agenda
    adapter: web
    url: https://www.arona.org/Agenda
    homepage: https://www.arona.org
    islands: [Tenerife]
    municipality: Arona
    license: "unknown – ToS not checked; HTML only"
    params:
      year_policy: infer
    notes: >-
      Day and month are printed without a year ("15 OCT."), so years are inferred (flagged).
      Only the first page (10 items plus highlighted groups) is read.

  - id: lpacultura
    priority: 40
    name: Las Palmas de Gran Canaria Cultura
    adapter: web
    url: https://lpacultura.com/events
    homepage: https://lpacultura.com
    islands: [Gran Canaria]
    municipality: Las Palmas de Gran Canaria
    license: "unknown – ToS not checked; HTML only"
    params:
      year_policy: infer
    notes: >-
      Livewire cards ("Jue. 15, Oct. de 17:30 - 18:30"); the Livewire snapshots hold no titles, so
      the generic block tier reads the cards. Years are inferred (flagged).

  - id: cact_lanzarote
    priority: 40
    name: Centros de Arte, Cultura y Turismo de Lanzarote (CACT)
    adapter: web
    url: https://cactlanzarote.com/es/eventos
    homepage: https://cactlanzarote.com
    islands: [Lanzarote]
    license: "unknown – ToS not checked; HTML only"
    params:
      year_policy: infer
    notes: Event cards with a day and month only; years are inferred (flagged).

  - id: cabildo_fuerteventura_agenda
    priority: 40
    name: Cabildo de Fuerteventura - agenda
    adapter: web
    url: https://www.cabildofuer.es/cabildo/agenda-cabildo-2/
    homepage: https://www.cabildofuer.es
    islands: [Fuerteventura]
    license: "unknown – ToS not checked; HTML only"
    params:
      year_policy: infer
    notes: >-
      Free-text dates ("1 de octubre-26 de noviembre", "Domingo 18 de octubre") without a year;
      years are inferred (flagged). "Varias fechas" entries have no date and are discarded.

  # Candidates that need a JS renderer: kept disabled because Playwright/Crawl4AI are optional
  # extras (pip install 'canarias-events[render]' or '[crawl]'); `render: auto` only renders when
  # static extraction finds nothing and the page looks JS-driven.

  - id: grancanaria_agenda
    priority: 40
    name: Gran Canaria turismo - agenda
    adapter: web
    url: https://www.grancanaria.com/turismo/es/agenda/agenda/
    homepage: https://www.grancanaria.com/turismo/es/agenda/
    enabled: false
    islands: [Gran Canaria]
    license: "unknown – ToS not checked; HTML only"
    params:
      render: auto
    notes: >-
      Live check 2026-10-15: static extraction worked (12 events, 3 inside 2026-10-19..25) because
      the first page is server-rendered; kept disabled until reviewed (flip `enabled` to use it).
      robots.txt answers with an Imperva/Incapsula 404 page, which counts as "no robots.txt".

  - id: tenerife_es_eventos
    priority: 40
    name: Cabildo de Tenerife - eventos
    adapter: web
    url: https://www.tenerife.es/eventos
    homepage: https://www.tenerife.es/eventos
    enabled: false
    islands: [Tenerife]
    license: "unknown – ToS not checked; HTML only"
    params:
      render: playwright
    notes: >-
      Live check 2026-10-15: 0 events statically; the page is a search form whose results are
      loaded by JavaScript and `render: auto` does not detect it as JS-driven, so the renderer is
      requested explicitly. Needs `pip install 'canarias-events[render]'`.

  - id: auditorio_tenerife
    priority: 40
    name: Auditorio de Tenerife - programación
    adapter: web
    url: https://www.auditoriodetenerife.com/es/programacion-aaee/
    homepage: https://www.auditoriodetenerife.com
    enabled: false
    islands: [Tenerife]
    municipality: Santa Cruz de Tenerife
    license: "unknown – ToS not checked; HTML only"
    params:
      render: auto
    notes: >-
      Live check 2026-10-15: 0 events statically; the programme is injected by an admin-ajax
      call. `render: auto` triggers the optional renderer (not installed by default, so the
      source ends as needs_manual_review). Needs `pip install 'canarias-events[render]'`.

  - id: ticketmaster
    priority: 30
    name: Ticketmaster Discovery API
    adapter: ticketmaster
    url: https://app.ticketmaster.com/discovery/v2/events.json
    homepage: https://developer.ticketmaster.com/
    islands: [Tenerife, Gran Canaria, Lanzarote, Fuerteventura, La Palma, La Gomera, El Hierro, La Graciosa]
    categories: [concerts, sports]
    license: Ticketmaster API terms of use (attribution and link back required)
    auth_env: TICKETMASTER_API_KEY
    notes: >-
      Opt-in: skipped with a warning when TICKETMASTER_API_KEY is not set. Free key, 5000 calls
      per day. Coverage in the Canary Islands is unmeasured.

  - id: gobcan_agenda_cultural
    priority: 80
    stale: true
    name: Gobierno de Canarias - agenda cultural (open data)
    adapter: ckan
    url: https://datos.canarias.es/catalogos/general/api/3/action/package_show?id=agenda-cultural
    homepage: https://datos.canarias.es/catalogos/general/dataset/agenda-cultural
    enabled: false
    license: gobcan-aviso-legal
    params:
      profile: gobcan_agenda
      resource_id: d179079c-a2ed-40dc-a748-7b64d093c342
    notes: >-
      Stale: the "agendaproxima.csv" resource only holds 5 events ending 2022-03-17 and the
      package metadata was last modified 2025-03-06. Adapter is ready if the dataset revives.

  - id: santacruz_agenda_cultural
    priority: 80
    stale: true
    name: Ayuntamiento de Santa Cruz de Tenerife - agenda cultural (open data)
    adapter: ckan
    url: https://www.santacruzdetenerife.es/opendata/api/3/action/package_show?id=agenda-cultural
    homepage: https://www.santacruzdetenerife.es/opendata/dataset/agenda-cultural
    enabled: false
    islands: [Tenerife]
    municipality: Santa Cruz de Tenerife
    license: cc-by
    params:
      resource_format: JSON
      records_key: docs
      field_map:
        title: nombre
        description: descripcion
        start: fecha_inicio
        end: fecha_fin
        category: categoria
        venue: lugar
        image: imagen
    notes: >-
      Stale: package metadata last modified 2019-05-21 and the sample records are from 2019.
      The field map follows the JSON resource and was only inspected, not run end to end.

