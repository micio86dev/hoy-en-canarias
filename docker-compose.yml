name: hoy-en-canarias

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hoy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoy_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hoy}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hoy} -d ${POSTGRES_DB:-hoy}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hoy}:${POSTGRES_PASSWORD:-hoy_dev_password}@db:5432/${POSTGRES_DB:-hoy}
      HOY_SITE_URL: ${HOY_SITE_URL:-http://localhost:3000}
      HOY_CORS_ORIGINS: ${HOY_CORS_ORIGINS:-http://localhost:3000}
      HOY_IMPORTER_DB_PATH: /data/events.sqlite
    volumes:
      - importer-data:/data
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["hoy", "worker"]
    environment:
      HOY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hoy}:${POSTGRES_PASSWORD:-hoy_dev_password}@db:5432/${POSTGRES_DB:-hoy}
      HOY_IMPORTER_DB_PATH: /data/events.sqlite
    volumes:
      - importer-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: apps/web
      args:
        NUXT_PUBLIC_SITE_URL: ${HOY_SITE_URL:-http://localhost:3000}
    environment:
      NUXT_API_BASE: http://api:8000
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db_test:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: hoy
      POSTGRES_PASSWORD: hoy_test_password
      POSTGRES_DB: hoy_test
    ports:
      - "${POSTGRES_TEST_HOST_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoy -d hoy_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["test"]

volumes:
  pgdata:
  importer-data:
