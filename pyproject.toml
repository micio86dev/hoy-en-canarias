[project]
name = "canarias-events"
version = "0.1.0"
description = "Importer of public Canary Islands events for the next Monday-Sunday week"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "feedparser>=6",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "typer>=0.12",
    "pyyaml>=6",
    "python-dotenv>=1",
    "rapidfuzz>=3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canarias_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: opt-in tests that hit the real network (run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
